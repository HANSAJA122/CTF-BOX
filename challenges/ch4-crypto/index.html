<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cryptography Challenge - Caesar Cipher</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; text-align: center; }
    .card { background: #1e293b; padding: 35px; border-radius: 12px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h1 { color: #f59e0b; }
    p { color: #94a3b8; line-height: 1.6; }
    .cipher-box { background: #0f172a; border: 1px border #334155; padding: 20px; border-radius: 8px; font-family: monospace; font-size: 18px; color: #fbbf24; margin: 20px 0; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Ancient Radio Intercept</h1>
    <p>Military intelligence intercepted a transmitted message encoded with Julius Caesar's shift cipher.</p>

    <div class="cipher-box">
      CIPHERTEXT: iodj{fdhoxu_flskhu_ghfrghg}
    </div>

    <p><em>Task:</em> Decrypt the ciphertext by determining the correct alphabet shift key (ROT-N) to recover the flag.</p>
  </div>
</body>
</html>
